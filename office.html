<body class="office-page">
<header class="top hide-print">
  <div class="top-in">
    <a class="brand" href="./" aria-label="Dominican Rite, today's Mass"><svg width="26" height="26" viewBox="0 0 40 40" aria-hidden="true"><rect x="17" y="3" width="6" height="34" fill="currentColor"/><rect x="3" y="17" width="34" height="6" fill="currentColor"/><circle cx="20" cy="4" r="3.6" fill="currentColor"/><circle cx="20" cy="36" r="3.6" fill="currentColor"/><circle cx="4" cy="20" r="3.6" fill="currentColor"/><circle cx="36" cy="20" r="3.6" fill="currentColor"/></svg>

    <nav class="nav" aria-label="Main"><a href="./">Mass</a><a href="office.html" aria-current="page">Office</a><a href="holyweek.html">Holy Week</a><a href="about.html">About</a></nav>
    <div class="top-tools">
      <button type="button" class="en-toggle" aria-pressed="false" title="Show the English with the Latin">EN</button>

</header>
<div class="sheet-back" id="sheetBack" hidden></div>
<aside class="sheet hide-print" id="sheet" aria-label="Options" hidden>

  <section class="sh-sec"><h3>Show</h3>
<label class="switch"><input type="checkbox" id="chant"> Chant (Antiphonarium O.P.)</label>
<label class="switch"><input type="checkbox" id="priest"> A priest or deacon presides</label>
  </section>
  <section class="sh-sec"><h3>Day</h3>
<input type="date" id="date" class="sh-date" aria-label="Date">
<div id="cal" class="sh-cal"></div>
  </section>
</aside>
<div class="content">
    <div class="inner">
      <div class="daybar hide-print"><button type="button" class="day-step" id="prevDay" aria-label="Previous day">‹</button><span class="day-d" id="dayMeta"></span><button type="button" class="day-step" id="nextDay" aria-label="Next day">›</button></div>
      <div class="day-t"><h2 class="day-title" id="dayTitle"></h2><p class="day-sub" id="dayRank"></p></div>
      <div id="hours" class="hours hide-print" role="tablist" aria-label="Hours"></div>
      <main id="office" aria-live="polite"></main>
    </div>
