<!DOCTYPE html>
<html lang="la">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dominican Rite — Mass</title>
<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
  <meta name="description" content="The sung propers, readings and Kyriale of the Dominican Rite Mass for any day, in square notation, from the Graduale O.P. (1950).">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+SC:wght@500;600&display=swap">
  <link rel="stylesheet" href="versiculum.css">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#111111">
</head>
<body>
<header class="top hide-print">
  <div class="top-in">
    <a class="brand" href="./" aria-label="Dominican Rite, today's Mass"><svg width="26" height="26" viewBox="0 0 40 40" aria-hidden="true"><rect x="17" y="3" width="6" height="34" fill="currentColor"/><rect x="3" y="17" width="34" height="6" fill="currentColor"/><circle cx="20" cy="4" r="3.6" fill="currentColor"/><circle cx="20" cy="36" r="3.6" fill="currentColor"/><circle cx="4" cy="20" r="3.6" fill="currentColor"/><circle cx="36" cy="20" r="3.6" fill="currentColor"/></svg>
      <span class="t1">Dominican Rite</span></a>
    <nav class="nav" aria-label="Main"><a href="./" aria-current="page">Mass</a><a href="office.html">Office</a><a href="holyweek.html">Holy Week</a><a href="rubrics.html">Rubrics</a><a href="about.html">About</a></nav>
    <div class="top-tools">
      <button type="button" class="gear" id="gear" aria-controls="sheet" aria-expanded="false" title="Options"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.2 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.4-2.9a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg><span>Options</span></button>
    </div>
  </div>
</header>
<div class="sheet-back" id="sheetBack" hidden></div>
<aside class="sheet hide-print" id="sheet" aria-label="Options" hidden>
  <div class="sheet-head"><span>Options</span><button type="button" class="sheet-x" id="sheetX" aria-label="Close">×</button></div>
  <section class="sh-sec"><h3>Day</h3>
<div class="field"><label for="date">Date</label><input type="date" id="date"></div>
<div class="field"><label for="selMass">Mass</label><select id="selMass"></select></div>
<div id="dateResults" class="alts"></div>
<div id="cal" class="sh-cal"></div>
  </section>
  <section class="sh-sec"><h3>Chants</h3>
<div class="field"><label for="selSeason">Season</label>
            <select id="selSeason">
              <option value="auto">From the date</option>
              <option value="annum">Per annum</option>
              <option value="lent">Septuagesima to Easter</option>
              <option value="pasch">Paschaltide</option>
            </select></div>
<div class="field"><label for="selOrd">Kyriale</label><select id="selOrd"></select></div>
<div class="field"><label for="selCredo">Credo</label><select id="selCredo"></select></div>
<div class="field"><label for="selAsp">Asperges</label>
            <select id="selAsp">
              <option value="">Automatic (Sundays)</option>
              <option value="none">None</option>
              <option value="asperges">Asperges me</option>
              <option value="vidi">Vidi aquam</option>
            </select></div>
  </section>
  <section class="sh-sec"><h3>Show</h3>
<div class="field"><label for="selOrdo">Order of Mass</label>
            <select id="selOrdo">
              <option value="">Propers only</option>
              <option value="low">Low Mass</option>
              <option value="sung">Sung Mass</option>
              <option value="solemn">Solemn Mass</option>
              <option value="conv">Conventual Mass</option>
            </select></div>
  </section>
  <section class="sh-sec"><h3>Advanced</h3>
<label class="switch"><input type="checkbox" id="chkEdit"> Edit the chants (GABC)</label>
  </section>
</aside>
<div class="content">
    <div class="inner">
      <div class="daybar hide-print"><button type="button" class="day-step" id="prevDay" aria-label="Previous day">‹</button><span class="day-d" id="dayDate"></span><button type="button" class="day-step" id="nextDay" aria-label="Next day">›</button><span class="day-meta" id="pills"></span></div>
      <div class="day-alts hide-print" id="dayAlts"></div>
      <div id="mhead"></div>
      <div class="massbar hide-print" id="massbar">
        <div class="seg" id="segForm" role="radiogroup" aria-label="Form of Mass"><button type="button" role="radio" data-v="">Propers</button><button type="button" role="radio" data-v="low">Low</button><button type="button" role="radio" data-v="sung">Sung</button><button type="button" role="radio" data-v="solemn">Solemn</button><button type="button" role="radio" data-v="conv"><span class="lg">Conventual</span><span class="sm">Conv.</span></button></div>
        <div class="seg" id="segLang" data-lang role="radiogroup" aria-label="Language"><button type="button" role="radio" data-v="tap">Latin</button><button type="button" role="radio" data-v="both">Latin + English</button></div>
        <div class="pmenu"><button type="button" class="pm-btn" id="btnPM" aria-expanded="false" aria-controls="pmList">Print &amp; share <span aria-hidden="true">▾</span></button>
          <div class="pm-list" id="pmList" hidden><button type="button" id="btnShare">Share this Mass</button><button type="button" id="btnChoir">Choir Book</button><button type="button" id="btnPriest">Priest’s Missal</button><button type="button" id="btnCong">Congregation Booklet</button></div></div>
      </div>
      <div class="rubopts hide-print" id="rubopts" hidden>
        <div class="ro ro-seg"><span>Rubrics</span><div class="seg seg-sm" id="segRub" role="radiogroup" aria-label="Rubrics"><button type="button" role="radio" data-v="">Basic</button><button type="button" role="radio" data-v="full">Full</button></div></div>
        <label class="ro"><span>Communion</span><select id="selComm"><option value="none">None</option><option value="simple">Of the faithful</option><option value="friars">Of the friars</option></select></label>
        <label class="ro"><span>Prelate</span><select id="selPrel"><option value="">None present</option><option value="pope">The Pope</option><option value="bp">Bishop in his see</option><option value="mo">Master of the Order</option></select></label>
        <label class="ro"><span>Sacrament</span><select id="selSac"><option value="">Not on this altar</option><option value="tab">In the tabernacle</option><option value="exp">Exposed</option></select></label>
        <label class="ro"><span>Servers</span><select id="selServ"><option value="one">One acolyte</option><option value="full">Full, with thurifer</option></select></label>
        <p class="ro-ai" id="roAi">The directions are summaries of the Missal’s rubrics, and their English an AI translation; tap ⓘ for the full rubric.</p>
      </div>
      <nav class="jump hide-print" id="jump" aria-label="Parts of the Mass"></nav>
      <main id="mass" aria-live="polite"></main>
      <article id="cong" class="cong" aria-hidden="true"></article>
    </div>
  </div>

  <script src="js/exsurge.min.js"></script>
  <script src="data/masses.js"></script>
  <script src="data/prefaces.js"></script>
  <script src="data/ordinary.js"></script>
  <script src="data/ordo.js"></script>
  <script src="data/kalendar39.js"></script>
  <script src="data/orations.js"></script>
  <script src="data/addiv.js"></script>
  <script src="data/memoriae.js"></script>
  <script src="data/readings33.js"></script>
  <script src="data/introit_gp.js"></script>
  <script src="data/holyweek.js"></script>
  <script src="data/holyweek_text.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cal.js"></script>
  <script src="js/psalm.js"></script>
  <script src="js/mtones.js"></script>
  <script src="js/mrank.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
